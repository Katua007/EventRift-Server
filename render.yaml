services:
  - type: web
    name: eventrift-server
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: FRONTEND_URL
        value: https://event-rift-client.vercel.app